name: Publish

on:
  push:
    tags:
      - "v*"
      - "moneyos-v*"
      - "moneyos-core-v*"
      - "moneyos-swap-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Select publish target from tag
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            v*)
              echo "package_dir=." >> "$GITHUB_OUTPUT"
              echo "package_name=moneyos" >> "$GITHUB_OUTPUT"
              echo "expected_version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
              ;;
            moneyos-v*)
              echo "package_dir=." >> "$GITHUB_OUTPUT"
              echo "package_name=moneyos" >> "$GITHUB_OUTPUT"
              echo "expected_version=${REF_NAME#moneyos-v}" >> "$GITHUB_OUTPUT"
              ;;
            moneyos-core-v*)
              echo "package_dir=packages/core" >> "$GITHUB_OUTPUT"
              echo "package_name=@moneyos/core" >> "$GITHUB_OUTPUT"
              echo "expected_version=${REF_NAME#moneyos-core-v}" >> "$GITHUB_OUTPUT"
              ;;
            moneyos-swap-v*)
              echo "package_dir=packages/swap" >> "$GITHUB_OUTPUT"
              echo "package_name=@moneyos/swap" >> "$GITHUB_OUTPUT"
              echo "expected_version=${REF_NAME#moneyos-swap-v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported tag: $REF_NAME" >&2
              exit 1
              ;;
          esac
          VERSION_PART="${REF_NAME##*-v}"
          if [[ "$VERSION_PART" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches package version
        env:
          PACKAGE_DIR: ${{ steps.target.outputs.package_dir }}
          EXPECTED_VERSION: ${{ steps.target.outputs.expected_version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./${PACKAGE_DIR#./}/package.json').version")
          if [ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Tag version $EXPECTED_VERSION does not match $PACKAGE_DIR/package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Prepare workspace outputs
        run: npm run build:core

      - name: Run CI checks
        run: |
          npm run lint
          npm run lint:core
          npm run lint:swap
          npm run typecheck
          npm run typecheck:core
          npm run typecheck:swap
          npm test

      - name: Verify packed release artifacts
        run: npm run release:verify

      - name: Publish package
        working-directory: ${{ steps.target.outputs.package_dir }}
        env:
          DIST_TAG: ${{ steps.target.outputs.dist_tag }}
        run: npx -y npm@latest publish --provenance --access public --tag "$DIST_TAG"
