name: Release Verify

on:
  pull_request:
    paths:
      - ".github/workflows/release-verify.yml"
      - ".github/workflows/publish.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/release-verify.mjs"
      - "src/**"
      - "packages/**"
      - "test/**"
      - "tsconfig*.json"
      - "tsup.config.ts"
      - "vitest.config.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-verify.yml"
      - ".github/workflows/publish.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/release-verify.mjs"
      - "src/**"
      - "packages/**"
      - "test/**"
      - "tsconfig*.json"
      - "tsup.config.ts"
      - "vitest.config.ts"
  workflow_dispatch:

jobs:
  release-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify packed release artifacts
        run: npm run release:verify
