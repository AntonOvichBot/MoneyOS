name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check release PR shape
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-release-pr-shape.mjs

      - name: Install dependencies
        run: npm ci

      - name: Prepare workspace outputs
        run: npm run build:core

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck:core
          npm run typecheck:swap

      - name: Lint
        run: |
          npm run lint
          npm run lint:core
          npm run lint:swap

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: |
          npm run build
          npm run build:swap

  windows-session-transport:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare workspace outputs
        run: npm run build:core

      - name: Test Windows named-pipe session transport
        run: npx vitest run test/config.test.ts test/session.test.ts test/connect-local-session.test.ts test/cli-wallet.test.ts
