name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare workspace outputs
        run: npm run build:core

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck:core
          npm run typecheck:swap

      - name: Lint
        run: |
          npm run lint
          npm run lint:core
          npm run lint:swap

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: |
          npm run build
          npm run build:swap
